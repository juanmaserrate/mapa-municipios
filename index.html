<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mapa Comercial - Real Catorce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <div class="app">
        <!-- Botón flotante para abrir el sidebar cuando está colapsado -->
        <button class="sidebar-open-btn" id="btnOpenSidebar" title="Mostrar panel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18"/>
            </svg>
        </button>

        <!-- Sidebar izquierdo -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <img src="img/logo-realcatorce.png" alt="Real Catorce">
                    </div>
                    <div>
                        <h1>Real Catorce</h1>
                        <p>Mapa Comercial · Buenos Aires</p>
                    </div>
                </div>
                <button class="btn-collapse" id="btnCollapseSidebar" title="Ocultar panel">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-section">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Buscar municipio o sociedad...">
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Estados</h3>
                <div class="status-filters">
                    <label class="status-filter">
                        <input type="checkbox" data-status="inscripto" checked>
                        <span class="status-badge inscripto">
                            <span class="status-dot"></span>
                            Inscripto
                        </span>
                        <span class="count" id="count-inscripto">0</span>
                    </label>
                    <label class="status-filter">
                        <input type="checkbox" data-status="por-iniciar" checked>
                        <span class="status-badge por-iniciar">
                            <span class="status-dot"></span>
                            Por iniciar
                        </span>
                        <span class="count" id="count-por-iniciar">0</span>
                    </label>
                    <label class="status-filter">
                        <input type="checkbox" data-status="no-inscripto">
                        <span class="status-badge no-inscripto">
                            <span class="status-dot"></span>
                            No inscripto
                        </span>
                        <span class="count" id="count-no-inscripto">0</span>
                    </label>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-header">
                    <h3>Sociedades</h3>
                    <button class="btn-icon" id="btnAddClient" title="Agregar sociedad">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                <div class="client-filters" id="clientFilters">
                    <!-- Generado dinámicamente -->
                </div>
            </div>

            <div class="sidebar-section sidebar-bottom">
                <div class="actions-row">
                    <button class="btn-secondary" id="btnExport" title="Exportar datos">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        Exportar
                    </button>
                    <button class="btn-secondary" id="btnImport" title="Importar datos">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        Importar
                    </button>
                    <input type="file" id="importFile" accept=".json" style="display:none">
                </div>
            </div>
        </aside>

        <!-- Mapa principal -->
        <main class="map-container">
            <div id="map"></div>
        </main>

        <!-- Panel de detalles del partido (derecha) -->
        <aside class="details-panel" id="detailsPanel">
            <div class="details-header">
                <button class="btn-close" id="btnCloseDetails">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
                <h2 id="detailsTitle">Partido</h2>
            </div>

            <div class="details-body">
                <div id="inscripcionesList" class="inscripciones-list">
                    <!-- Lista de sociedades inscriptas -->
                </div>

                <button class="btn-primary" id="btnAddInscripcion">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Agregar sociedad a este partido
                </button>
            </div>
        </aside>
    </div>

    <!-- Modal: nueva/editar inscripción -->
    <div class="modal" id="modalInscripcion" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalInscripcionTitle">Inscripción</h2>
                <button class="btn-close" id="btnCloseInscripcionModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="inscripcionForm">
                <div class="form-group">
                    <label>Sociedad</label>
                    <select id="fieldCliente" required>
                        <option value="">Seleccionar...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Estado</label>
                    <div class="status-selector">
                        <label class="status-option">
                            <input type="radio" name="estado" value="inscripto">
                            <span class="status-badge inscripto">
                                <span class="status-dot"></span> Inscripto
                            </span>
                        </label>
                        <label class="status-option">
                            <input type="radio" name="estado" value="por-iniciar">
                            <span class="status-badge por-iniciar">
                                <span class="status-dot"></span> Por iniciar
                            </span>
                        </label>
                        <label class="status-option">
                            <input type="radio" name="estado" value="no-inscripto">
                            <span class="status-badge no-inscripto">
                                <span class="status-dot"></span> No inscripto
                            </span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Razón / Descripción</label>
                    <textarea id="fieldDescripcion" rows="2" placeholder="Razón del estado, observaciones..."></textarea>
                </div>

                <div class="form-group">
                    <label>Notas internas</label>
                    <textarea id="fieldNotas" rows="3" placeholder="Notas del área comercial..."></textarea>
                </div>

                <div class="form-group">
                    <label>Archivos adjuntos</label>
                    <div class="files-area">
                        <div class="files-list" id="filesList"></div>
                        <label class="file-upload">
                            <input type="file" id="fieldArchivo" multiple>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                            </svg>
                            Adjuntar archivos (PDF, imágenes, etc.)
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-danger" id="btnDeleteInscripcion" style="display:none">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Eliminar
                    </button>
                    <button type="button" class="btn-secondary" id="btnCancelInscripcion">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: nueva sociedad -->
    <div class="modal" id="modalClient" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nueva sociedad</h2>
                <button class="btn-close" id="btnCloseClientModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="clientForm">
                <div class="form-group">
                    <label>Nombre de la sociedad</label>
                    <input type="text" id="clientName" required placeholder="Ej: AILIEL">
                </div>
                <div class="form-group">
                    <label>Color de identificación</label>
                    <div class="color-picker" id="colorPicker">
                        <label><input type="radio" name="color" value="#3b82f6" checked><span style="background:#3b82f6"></span></label>
                        <label><input type="radio" name="color" value="#8b5cf6"><span style="background:#8b5cf6"></span></label>
                        <label><input type="radio" name="color" value="#ec4899"><span style="background:#ec4899"></span></label>
                        <label><input type="radio" name="color" value="#f97316"><span style="background:#f97316"></span></label>
                        <label><input type="radio" name="color" value="#14b8a6"><span style="background:#14b8a6"></span></label>
                        <label><input type="radio" name="color" value="#eab308"><span style="background:#eab308"></span></label>
                        <label><input type="radio" name="color" value="#06b6d4"><span style="background:#06b6d4"></span></label>
                        <label><input type="radio" name="color" value="#a855f7"><span style="background:#a855f7"></span></label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btnCancelClient">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear sociedad</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
